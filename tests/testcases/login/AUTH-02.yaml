module: login
flow_id: AUTH-02
flow_name: continue_disabled_until_form_complete
priority: P1
type: [e2e]
tags: [regression]

actors:
  - unauthenticated

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [workbench_ui_employee_user_login, home]

cases:
  - id: AUTH-02-H1
    title: Enable Continue when username, password, city and consent are all set
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Fill username_30177a with QA_USERNAME from .env"
      - "3. Fill password_53fc5f with QA_PASSWORD from .env"
      - "4. Click select_an_option_be0437, then choose the option 'Sierra Leone'"
      - "5. Click by_clicking_i_accept_the_410d00 to tick field_3_b57319"
    assertions:
      - continue_button_enabled
      - url_pathname_is_workbench_ui_employee_user_login
    test_data_ref: AUTH-02-H1
    coverage_note: >
      Positive partition: the only input combination that should enable Continue; nothing is submitted.

  - id: AUTH-02-E1
    title: Keep Continue disabled on an empty form
    type: negative
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
    assertions:
      - continue_button_disabled
    test_data_ref: AUTH-02-E1
    coverage_note: >
      Empty-form partition (observed live on 13 Nov); the button is disabled, so no error message is expected.

  - id: AUTH-02-E2
    title: Keep Continue disabled with username and password but no city or consent
    type: negative
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Fill username_30177a with QA_USERNAME from .env"
      - "3. Fill password_53fc5f with QA_PASSWORD from .env"
    assertions:
      - continue_button_disabled
      - city_field_empty
      - consent_checkbox_unchecked
    test_data_ref: AUTH-02-E2
    coverage_note: >
      Credentials-only partition: proves city and consent are required, not just the credentials.

  - id: AUTH-02-E3
    title: Keep Continue disabled when everything except consent is set
    type: negative
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Fill username_30177a with QA_USERNAME from .env"
      - "3. Fill password_53fc5f with QA_PASSWORD from .env"
      - "4. Click select_an_option_be0437, then choose the option 'Sierra Leone'"
    assertions:
      - continue_button_disabled
      - consent_checkbox_unchecked
    test_data_ref: AUTH-02-E3
    coverage_note: >
      Isolates the privacy-consent requirement: every other input is valid.

  - id: AUTH-02-E4
    title: Disable Continue again when consent is unticked after completing the form
    type: edge_case
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Fill username_30177a with QA_USERNAME from .env"
      - "3. Fill password_53fc5f with QA_PASSWORD from .env"
      - "4. Click select_an_option_be0437, then choose the option 'Sierra Leone'"
      - "5. Click by_clicking_i_accept_the_410d00 to tick field_3_b57319 and wait for continue_5f8c5f to be enabled"
      - "6. Click by_clicking_i_accept_the_410d00 again to untick field_3_b57319"
    assertions:
      - continue_button_disabled
      - consent_checkbox_unchecked
    test_data_ref: AUTH-02-E4
    coverage_note: >
      State transition enabled to disabled: withdrawing consent must re-disable Continue.
