module: login
flow_id: AUTH-04
flow_name: unknown_username_rejected
priority: P1
type: [e2e]
tags: [regression]

actors:
  - unauthenticated

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [workbench_ui_employee_user_login, home]

cases:
  - id: AUTH-04-E1
    title: Reject an unknown username with the same message as a wrong password
    type: negative
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Fill username_30177a with the synthetic unknown username from test data AUTH-04-E1"
      - "3. Fill password_53fc5f with the synthetic password from test data AUTH-04-E1"
      - "4. Click select_an_option_be0437, then choose the option 'Sierra Leone'"
      - "5. Click by_clicking_i_accept_the_410d00 to tick field_3_b57319"
      - "6. Click continue_5f8c5f"
    assertions:
      - url_pathname_is_workbench_ui_employee_user_login
      - login_error_message_visible
      - login_error_message_same_as_wrong_password
      - no_session_token_in_local_storage
    test_data_ref: AUTH-04-E1
    coverage_note: >
      Unknown-account partition; the team confirmed the message is the same as for a wrong password, so the app does not reveal which usernames exist.
