module: login
flow_id: AUTH-11
flow_name: privacy_consent_and_policy
priority: P1
type: [e2e]
tags: [regression]

actors:
  - unauthenticated

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [workbench_ui_employee_user_login, home]

cases:
  - id: AUTH-11-H1
    title: Tick the privacy consent by clicking its label, with nothing opening
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Click by_clicking_i_accept_the_410d00"
    assertions:
      - consent_checkbox_checked
      - no_dialog_opened
      - url_pathname_is_workbench_ui_employee_user_login
    test_data_ref: AUTH-11-H1
    coverage_note: >
      Team confirmed on 2026-11-16 that this control is just a checkbox and opens nothing.

  - id: AUTH-11-H2
    title: Untick the privacy consent by clicking its label again
    type: happy_path
    test_type: [e2e]
    priority: P2
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Click by_clicking_i_accept_the_410d00 and wait for field_3_b57319 to be checked"
      - "3. Click by_clicking_i_accept_the_410d00 again"
    assertions:
      - consent_checkbox_unchecked
    test_data_ref: AUTH-11-H2
    coverage_note: >
      Toggle back to unchecked; AUTH-02-E4 checks the effect on Continue, this checks the checkbox itself.

  - id: AUTH-11-H3
    title: Open the Privacy Policy from the login form
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Click privacy_policy_29eb8b"
    assertions:
      - privacy_policy_content_visible
    test_data_ref: AUTH-11-H3
    coverage_note: >
      The policy itself; its content and close/accept controls are not in the contract (capture selector on first run).
