module: login
flow_id: AUTH-10
flow_name: forgot_password_opens_reset_page
priority: P1
type: [e2e]
tags: [regression]

actors:
  - unauthenticated

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [workbench_ui_employee_user_login, home]

cases:
  - id: AUTH-10-H1
    title: Open the password-reset page from Forgot password? without submitting
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /workbench-ui/employee/user/login"
      - "Do not submit the reset form: it may send a code to a real user"
    steps:
      - "1. Open /workbench-ui/employee/user/login and wait for animation_1dcbe0 to be hidden"
      - "2. Click forgot_password_54faff"
      - "3. Wait for the URL to change away from /workbench-ui/employee/user/login and for animation_1dcbe0 to be hidden"
    assertions:
      - url_pathname_is_forgot_password_page
      - login_form_not_visible
    test_data_ref: AUTH-10-H1
    coverage_note: >
      Navigation to password reset; the reset path and its form are not in the contract (likely /workbench-ui/employee/user/forgot-password, to confirm on first run).
