module: user-management
flow_id: USR-12
flow_name: logged_out_cannot_open_user_pages
priority: P0
type: [e2e]
tags: [smoke, regression]

actors:
  - unauthenticated

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [payments_ui_employee_hrms_inbox, payments_ui_employee_hrms_create]

cases:
  - id: USR-12-H1
    title: Redirect a logged-out visitor away from Search user
    type: happy_path
    test_type: [e2e]
    priority: P0
    tags: [smoke, regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /payments-ui/employee/hrms/inbox"
      - "The test only checks the redirect; it never logs in on the payments-ui login (workbench login only)"
    steps:
      - "1. Open /payments-ui/employee/hrms/inbox"
      - "2. Wait for the URL pathname to change away from /payments-ui/employee/hrms/inbox"
    assertions:
      - url_pathname_is_payments_ui_employee_user_login   # expected; same redirect as the complaint pages (CMP-09)
      - search_fields_not_present
    test_data_ref: USR-12-H1
    coverage_note: >
      Route protection for the user list; the contract marks the page is_protected false only because it is an unexplored stub.

  - id: USR-12-H2
    title: Redirect a logged-out visitor away from Create user
    type: happy_path
    test_type: [e2e]
    priority: P0
    tags: [smoke, regression]
    preconditions:
      - "Fresh browser context with no stored session"
      - "Browser is on the origin + /payments-ui/employee/hrms/create"
      - "The test only checks the redirect; it never logs in on the payments-ui login (workbench login only)"
    steps:
      - "1. Open /payments-ui/employee/hrms/create"
      - "2. Wait for the URL pathname to change away from /payments-ui/employee/hrms/create"
    assertions:
      - url_pathname_is_payments_ui_employee_user_login
      - create_form_not_present
    test_data_ref: USR-12-H2
    coverage_note: >
      Route protection for user creation, a different page from H1.

rbac_checks:
  - id: USR-12-RBAC-1
    actor: unauthenticated
    endpoint: "POST /egov-hrms/employees/_search (observed live 2026-11-16; no API contract yet)"
    expected_status: 401
