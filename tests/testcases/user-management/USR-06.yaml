module: user-management
flow_id: USR-06
flow_name: user_details_page
priority: P1
type: [e2e]
tags: [regression]

actors:
  - admin   # default actor: the .env test account via .auth/storage-state.json written by global-setup.ts (exact roles not confirmed)

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [payments_ui_employee_hrms_inbox, home]   # the details page (/payments-ui/employee/hrms/details/<username>) is not in the contract

cases:
  - id: USR-06-H1
    title: Open the test account's details page from the search result
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Authenticated session from global-setup.ts (workbench login) loaded from .auth/storage-state.json"
      - "Safety guard: the test aborts any request whose URL ends in _create or _update, so no user is created or changed"
      - "Browser is on the origin + /payments-ui/employee/hrms/inbox"
      - "Only the test account's own details are opened; the personal values on the page are never logged or compared"
    steps:
      - "1. Open /payments-ui/employee/hrms/inbox, wait for animation_1dcbe0 to be hidden, choose ADMIN_KAMBIA in the Hierarchy type dropdown and click Next"
      - "2. Search the Username field (input name=codes) for QA_USERNAME from .env"
      - "3. Click the username link in the result row ([role=table] span.link)"
      - "4. Wait for animation_1dcbe0 to be hidden"
    assertions:
      - url_pathname_starts_with_payments_ui_employee_hrms_details
      - details_sections_visible   # Employee Details, Login Details, Personal Details, Jurisdiction Details, Assignment Details
      - take_action_button_visible
    test_data_ref: USR-06-H1
    coverage_note: >
      The details page, reached from a search result (contract gap: page not in the contract).

  - id: USR-06-H2
    title: List the Edit actions in the Take Action menu without using them
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Authenticated session from global-setup.ts (workbench login) loaded from .auth/storage-state.json"
      - "Safety guard: the test aborts any request whose URL ends in _create or _update, so no user is created or changed"
      - "Browser is on the origin + /payments-ui/employee/hrms/inbox"
      - "Nothing in the menu is clicked; the test login account itself is never edited"
    steps:
      - "1. Open /payments-ui/employee/hrms/inbox, wait for animation_1dcbe0 to be hidden, choose ADMIN_KAMBIA in the Hierarchy type dropdown and click Next"
      - "2. Search the Username field (input name=codes) for QA_USERNAME from .env"
      - "3. Click the username link in the result row and wait for animation_1dcbe0 to be hidden"
      - "4. Click Take Action"
    assertions:
      - action_menu_shows_edit_employee
      - action_menu_shows_edit_campaign_assignment
      - deactivate_not_offered_for_own_account   # the logged-in account cannot deactivate itself (observed live 2026-11-16)
    test_data_ref: USR-06-H2
    coverage_note: >
      The actions offered on the logged-in account itself (two, no Deactivate); USR-13-H3 checks the three actions on another user.

rbac_checks:
  - id: USR-06-RBAC-1
    actor: unauthenticated
    endpoint: "POST /egov-hrms/employees/_search (observed live 2026-11-16; the details page loads the user through it; no API contract yet)"
    expected_status: 401
