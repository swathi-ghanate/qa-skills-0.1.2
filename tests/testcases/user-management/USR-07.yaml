module: user-management
flow_id: USR-07
flow_name: open_create_user_from_home
priority: P0
type: [e2e]
tags: [smoke, regression]

actors:
  - admin   # default actor: the .env test account via .auth/storage-state.json written by global-setup.ts (exact roles not confirmed)

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [workbench_ui_employee, payments_ui_employee_hrms_create, home]

cases:
  - id: USR-07-H1
    title: Open Create user from the User management card on the workbench home
    type: happy_path
    test_type: [e2e]
    priority: P0
    tags: [smoke, regression]
    preconditions:
      - "Authenticated session from global-setup.ts (workbench login) loaded from .auth/storage-state.json"
      - "DIGIT sessionStorage rebuilt from the saved session (restoreSavedSession), needed by the workbench home"
      - "Safety guard: the test aborts any request whose URL ends in _create or _update, so no user is created or changed"
      - "Browser is on the origin + /workbench-ui/employee"
    steps:
      - "1. Open /workbench-ui/employee and wait for animation_1dcbe0 to be hidden"
      - "2. Wait for create_user_980434 to be visible"
      - "3. Click create_user_980434"
      - "4. Wait for the URL pathname to be /payments-ui/employee/hrms/create and for animation_1dcbe0 to be hidden"
      - "5. Choose ADMIN_KAMBIA in the Hierarchy type dropdown and click Next"
    assertions:
      - url_pathname_is_payments_ui_employee_hrms_create
      - create_user_heading_visible
      - username_field_visible   # #hrms-create-hr_emp_id_label
      - submit_disabled
    test_data_ref: USR-07-H1
    coverage_note: >
      The real user path into Create user; also proves Submit starts disabled on an empty form.

rbac_checks:
  - id: USR-07-RBAC-1
    actor: unauthenticated
    endpoint: "POST /egov-hrms/employees/_create (assumed DIGIT HRMS create endpoint; confirm with qa-kit api-scrape; send an invalid payload only)"
    expected_status: 401
