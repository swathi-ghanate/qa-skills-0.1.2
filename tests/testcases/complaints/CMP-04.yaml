module: complaints
flow_id: CMP-04
flow_name: boundary_cascade
priority: P1
type: [e2e]
tags: [regression]

actors:
  - admin   # default actor: the .env test account via .auth/storage-state.json written by global-setup.ts (exact roles not confirmed)

environments:
  qa_ui: https://sierraleone-hcm.digit.org/workbench-ui/employee   # workbench home = post-login page; steps use absolute paths from the origin

ui_pages: [payments_ui_employee_pgr_create_complaint, home]

cases:
  - id: CMP-04-H1
    title: Choose a full boundary path from Country down to Community
    type: happy_path
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Authenticated session from global-setup.ts (workbench login) loaded from .auth/storage-state.json"
      - "Safety guard: the test aborts any create request (URL ending in _create), so no complaint can be created"
      - "Browser is on the origin + /payments-ui/employee/pgr/create-complaint"
    steps:
      - "1. Open /payments-ui/employee/pgr/create-complaint, wait for animation_1dcbe0 to be hidden and for the one-time form rebuild (form element replaced, max 15 s)"
      - "2. Check that only the Country dropdown is shown (Province not yet visible)"
      - "3. Choose the Country from test data CMP-04-H1 (field_3_f0ae98 selector is broken; use the dropdown labelled Country, options .digit-dropdown-item)"
      - "4. Wait for the Province dropdown to appear and choose the Province from test data"
      - "5. Wait for the District dropdown to appear and choose the District from test data"
      - "6. Wait for the Chiefdom dropdown to appear and choose the Chiefdom from test data"
      - "7. Wait for the PHU dropdown to appear and choose the PHU from test data"
      - "8. Wait for the Distribution Point dropdown to appear and choose the Distribution Point from test data"
      - "9. Wait for the Community dropdown to appear and choose the Community from test data"
    assertions:
      - boundary_values_match_test_data   # all 7 levels show the chosen values
    test_data_ref: CMP-04-H1
    coverage_note: >
      The 7-level cascade (contract gap: the levels below Country were captured live); each level must appear only after its parent is chosen.

  - id: CMP-04-E1
    title: Reset the lower boundary levels when the Province is changed
    type: edge_case
    test_type: [e2e]
    priority: P1
    tags: [regression]
    preconditions:
      - "Authenticated session from global-setup.ts (workbench login) loaded from .auth/storage-state.json"
      - "Safety guard: the test aborts any create request (URL ending in _create), so no complaint can be created"
      - "Browser is on the origin + /payments-ui/employee/pgr/create-complaint"
      - "The expected behaviour is an assumption [IMP] until the team confirms it"
    steps:
      - "1. Open /payments-ui/employee/pgr/create-complaint, wait for animation_1dcbe0 to be hidden and for the one-time form rebuild (form element replaced, max 15 s)"
      - "2. Choose Country, Province, District and Chiefdom from test data CMP-04-E1"
      - "3. Change the Province to the changedProvince value from test data CMP-04-E1"
    assertions:
      - district_cleared_after_province_change
      - chiefdom_not_shown_or_cleared
    test_data_ref: CMP-04-E1
    coverage_note: >
      A changed parent must not leave stale child values; H1 only moves forward through the levels.

rbac_checks:
  - id: CMP-04-RBAC-1
    actor: unauthenticated
    endpoint: "POST <TBD: boundary search API called by /payments-ui/employee/pgr/create-complaint; run qa-kit api-scrape>"
    expected_status: 401
